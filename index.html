<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易数据分析看板 - 云端版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* ===== 样式（与原版一致） ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-dark: #0b0e14; --bg-card: #131a22; --bg-input: #1c2632;
            --border-color: #2a3a4a; --text-primary: #e8edf2; --text-secondary: #8a9aa8;
            --gold: #d4a843; --gold-dim: #a5832e; --green-profit: #4ecdc4; --red-loss: #ff6b6b;
            --shadow: 0 8px 32px rgba(0,0,0,0.6); --radius: 10px; --transition: 0.25s ease;
        }
        html, body { height:100%; font-family:'Segoe UI','PingFang SC',Roboto,sans-serif; background:var(--bg-dark); color:var(--text-primary); }
        button { cursor:pointer; font-family:inherit; border:none; outline:none; }
        input, select { font-family:inherit; outline:none; border:none; background:var(--bg-input); color:var(--text-primary); padding:8px 12px; border-radius:6px; border:1px solid var(--border-color); transition:var(--transition); }
        input:focus, select:focus { border-color:var(--gold); box-shadow:0 0 0 2px rgba(212,168,67,0.25); }
        table { width:100%; border-collapse:collapse; font-size:14px; }
        th { background:var(--bg-input); color:var(--gold); font-weight:600; padding:10px 8px; text-align:left; border-bottom:2px solid var(--gold-dim); white-space:nowrap; }
        td { padding:8px 8px; border-bottom:1px solid var(--border-color); white-space:nowrap; }
        tr:hover td { background:rgba(212,168,67,0.04); }
        .scroll-wrap { overflow-x:auto; padding-bottom:4px; }
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-track { background:var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background:var(--gold-dim); border-radius:6px; }
        ::-webkit-scrollbar-thumb:hover { background:var(--gold); }
        #loginPage { display:flex; justify-content:center; align-items:center; height:100vh; background:radial-gradient(ellipse at 30% 40%, #16212b, #080b10); }
        .login-box { background:var(--bg-card); padding:48px 40px 40px; border-radius:var(--radius); box-shadow:var(--shadow); width:400px; border:1px solid var(--border-color); position:relative; }
        .login-box h1 { font-size:28px; font-weight:300; text-align:center; margin-bottom:6px; letter-spacing:2px; }
        .login-box h1 span { color:var(--gold); font-weight:600; }
        .login-box .sub { text-align:center; color:var(--text-secondary); font-size:14px; margin-bottom:28px; border-bottom:1px solid var(--border-color); padding-bottom:18px; }
        .login-box label { display:block; font-size:13px; color:var(--text-secondary); margin-bottom:4px; margin-top:14px; }
        .login-box input { width:100%; padding:10px 14px; font-size:15px; }
        .login-box .btn-login { width:100%; padding:12px; margin-top:26px; background:var(--gold); color:#0b0e14; font-size:17px; font-weight:700; border-radius:6px; transition:var(--transition); letter-spacing:1px; }
        .login-box .btn-login:hover { background:#e8c85a; transform:translateY(-1px); box-shadow:0 4px 20px rgba(212,168,67,0.3); }
        .login-box .error { color:var(--red-loss); font-size:14px; text-align:center; margin-top:12px; min-height:22px; }
        #app { display:none; height:100vh; flex-direction:column; background:var(--bg-dark); }
        .header { background:var(--bg-card); padding:12px 28px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); flex-shrink:0; flex-wrap:wrap; gap:8px 16px; }
        .header .user-info { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
        .header .user-info .name { font-size:18px; font-weight:600; }
        .header .user-info .role-badge { background:var(--gold-dim); color:#fff; font-size:12px; padding:2px 14px; border-radius:20px; font-weight:600; letter-spacing:0.5px; }
        .header .slogan { color:var(--gold); font-size:18px; font-weight:500; letter-spacing:1px; text-shadow:0 0 12px rgba(212,168,67,0.15); flex:1; text-align:center; min-width:180px; }
        .header .actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        .header .actions select { background:var(--bg-input); color:var(--text-primary); border:1px solid var(--border-color); padding:4px 8px; border-radius:4px; font-size:13px; }
        .header .actions button { background:transparent; color:var(--text-secondary); padding:6px 16px; border-radius:6px; border:1px solid var(--border-color); font-size:13px; transition:var(--transition); }
        .header .actions button:hover { border-color:var(--gold); color:var(--gold); background:rgba(212,168,67,0.08); }
        .header .actions .logout-btn { border-color:#5a2a2a; color:var(--red-loss); }
        .header .actions .logout-btn:hover { border-color:var(--red-loss); background:rgba(255,107,107,0.08); }
        .main-body { display:flex; flex:1; overflow:hidden; }
        .sidebar { width:10%; min-width:80px; background:var(--bg-card); border-right:1px solid var(--border-color); padding:16px 0; flex-shrink:0; overflow-y:auto; }
        .sidebar .menu-item { padding:12px 10px; font-size:14px; color:var(--text-secondary); cursor:pointer; transition:var(--transition); border-left:3px solid transparent; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; }
        .sidebar .menu-item .icon { font-size:20px; }
        .sidebar .menu-item .label { font-size:11px; line-height:1.2; }
        .sidebar .menu-item:hover { background:rgba(212,168,67,0.06); color:var(--text-primary); }
        .sidebar .menu-item.active { color:var(--gold); border-left-color:var(--gold); background:rgba(212,168,67,0.08); }
        .content { flex:1; padding:20px 28px; overflow-y:auto; background:var(--bg-dark); }
        .content .page-title { font-size:22px; font-weight:300; margin-bottom:18px; color:var(--text-primary); border-bottom:1px solid var(--border-color); padding-bottom:10px; }
        .content .page-title small { color:var(--text-secondary); font-size:14px; font-weight:400; margin-left:12px; }
        .toolbar { display:flex; flex-wrap:wrap; gap:10px 16px; margin-bottom:16px; align-items:center; }
        .toolbar .btn { padding:7px 18px; border-radius:6px; font-size:13px; font-weight:600; transition:var(--transition); background:var(--bg-input); color:var(--text-primary); border:1px solid var(--border-color); }
        .toolbar .btn:hover { border-color:var(--gold); color:var(--gold); }
        .toolbar .btn-primary { background:var(--gold); color:#0b0e14; border-color:var(--gold); }
        .toolbar .btn-primary:hover { background:#e8c85a; border-color:#e8c85a; color:#0b0e14; }
        .toolbar .btn-success { border-color:#2a6a5a; color:var(--green-profit); }
        .toolbar .btn-success:hover { background:rgba(78,205,196,0.08); border-color:var(--green-profit); }
        .toolbar .btn-danger { border-color:#5a2a2a; color:var(--red-loss); }
        .toolbar .btn-danger:hover { background:rgba(255,107,107,0.1); border-color:var(--red-loss); }
        .empty-msg { color:var(--text-secondary); text-align:center; padding:40px 0; font-size:15px; }
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); z-index:999; justify-content:center; align-items:center; }
        .modal-overlay.open { display:flex; }
        .modal-box { background:var(--bg-card); border-radius:var(--radius); box-shadow:var(--shadow); padding:32px 36px; max-width:640px; width:92%; max-height:90vh; overflow-y:auto; border:1px solid var(--border-color); }
        .modal-box h3 { font-size:20px; font-weight:400; margin-bottom:18px; color:var(--gold); }
        .modal-box label { display:block; font-size:13px; color:var(--text-secondary); margin-top:12px; margin-bottom:4px; }
        .modal-box input, .modal-box select { width:100%; padding:8px 12px; }
        .modal-box .btn-row { display:flex; gap:12px; margin-top:22px; justify-content:flex-end; }
        .modal-box .btn-row .btn { padding:8px 28px; border-radius:6px; font-weight:600; font-size:14px; }
        .modal-box .btn-row .btn-cancel { background:transparent; color:var(--text-secondary); border:1px solid var(--border-color); }
        .modal-box .btn-row .btn-cancel:hover { border-color:var(--text-secondary); }
        .modal-box .btn-row .btn-confirm { background:var(--gold); color:#0b0e14; }
        .modal-box .btn-row .btn-confirm:hover { background:#e8c85a; }
        .modal-box .form-hint { color:var(--text-secondary); font-size:12px; margin-top:4px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 24px; }
        .kpi-card { background: var(--bg-card); padding: 14px 12px; border-radius: var(--radius); border: 1px solid var(--border-color); text-align: center; }
        .kpi-card .label { color: var(--text-secondary); font-size: 13px; }
        .kpi-card .value { font-size: clamp(18px, 2.2vw, 24px); font-weight: 600; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chart-main { display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap; height: 710px; align-items: stretch; }
        .chart-left { flex: 0 0 25%; min-width: 220px; background: var(--bg-card); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; height: 100%; }
        .chart-left h4 { color: var(--text-secondary); font-weight: 400; text-align: center; margin-bottom: 10px; flex-shrink: 0; }
        .chart-left canvas { flex: 1; width: 100% !important; height: 100% !important; min-height: 0; }
        .chart-right { flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 20px; height: 100%; }
        .chart-box { background: var(--bg-card); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border-color); flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
        .chart-box h4 { color: var(--text-secondary); font-weight: 400; margin-bottom: 10px; text-align: center; flex-shrink: 0; }
        .chart-box canvas { flex: 1; width: 100% !important; height: 100% !important; min-height: 0; }
        @media (max-width:820px) { ... }
        @media (max-width:600px) { ... }
        .capital-setting { display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:var(--bg-input); padding:12px 18px; border-radius:8px; margin-bottom:16px; border:1px solid var(--border-color); }
        .capital-setting label { color:var(--text-secondary); font-size:14px; }
        .capital-setting input { width:160px; padding:6px 12px; }
        .capital-setting .btn { padding:6px 18px; border-radius:6px; background:var(--gold); color:#0b0e14; font-weight:600; }
        .capital-setting .btn:hover { background:#e8c85a; }
        .capital-display { color:var(--gold); font-weight:600; font-size:16px; margin-left:4px; }
        .loading { text-align:center; padding:40px 0; color:var(--text-secondary); }
    </style>
</head>
<body>
    <!-- ===== 登录页 ===== -->
    <div id="loginPage">
        <div class="login-box">
            <h1>📊 <span>交易看板</span></h1>
            <div class="sub">云端版 · 数据持久化</div>
            <label>用户名</label>
            <input id="loginUser" type="text" value="admin" placeholder="请输入用户名">
            <label>密码</label>
            <input id="loginPass" type="password" value="123456" placeholder="请输入密码">
            <button class="btn-login" onclick="doLogin()">登 录</button>
            <div class="error" id="loginError"></div>
        </div>
    </div>

    <!-- ===== 主应用 ===== -->
    <div id="app">
        <header class="header">
            <div class="user-info">
                <span class="name" id="headerName">—</span>
                <span class="role-badge" id="headerRole">—</span>
            </div>
            <div class="slogan">⚡ 该进进、该出出、不做判断、只做跟随！</div>
            <div class="actions">
                <span id="userSwitchContainer" style="display:none;">
                    <label style="color:var(--text-secondary);font-size:13px;">查看用户：</label>
                    <select id="userSwitchSelect" onchange="switchViewUser(this.value)"></select>
                </span>
                <button onclick="openChangePwd()">🔑 修改密码</button>
                <button class="logout-btn" onclick="doLogout()">退出</button>
            </div>
        </header>
        <div class="main-body">
            <nav class="sidebar" id="sidebar">
                <div class="menu-item active" data-page="home" onclick="switchPage('home')">
                    <span class="icon">🏠</span><span class="label">主页</span>
                </div>
                <div class="menu-item" data-page="trades" onclick="switchPage('trades')">
                    <span class="icon">📈</span><span class="label">交易记录</span>
                </div>
                <div class="menu-item" data-page="data" onclick="switchPage('data')">
                    <span class="icon">⚙️</span><span class="label">数据维护</span>
                </div>
                <div class="menu-item" data-page="users" onclick="switchPage('users')">
                    <span class="icon">👥</span><span class="label">用户管理</span>
                </div>
            </nav>
            <div class="content" id="contentArea">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <!-- ===== 模态框 ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox"></div>
    </div>

    <script>
        // ======================================================================
        //  全局 API 客户端
        // ======================================================================
        const API_BASE = '/api';

        async function apiRequest(endpoint, options = {}) {
            const token = localStorage.getItem('token');
            const headers = {
                'Content-Type': 'application/json',
                ...(token && { 'Authorization': `Bearer ${token}` }),
                ...options.headers
            };
            const response = await fetch(`${API_BASE}${endpoint}`, {
                ...options,
                headers
            });
            if (!response.ok) {
                const error = await response.json().catch(() => ({}));
                throw new Error(error.error || '请求失败');
            }
            return response.json();
        }

        // ======================================================================
        //  会话状态
        // ======================================================================
        let currentUser = null;
        let viewingUser = 'all';
        let currentPage = 'home';
        let _editingUsername = null; // 用于新增/编辑交易时记录归属用户

        // ======================================================================
        //  工具函数
        // ======================================================================
        function genId() { return Date.now() + Math.floor(Math.random() * 1000); }
        function fmt(n) {
            if (typeof n === 'number') {
                if (Number.isInteger(n)) return n.toString();
                return n.toFixed(2);
            }
            return n;
        }
        function formatCurrency(n) {
            if (n === undefined || n === null || isNaN(n)) return '—';
            let parts = n.toFixed(2).split('.');
            let intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return intPart + '.' + parts[1];
        }
        function calcTakeProfit(trade) {
            return { tp1: null, tp2: null };
        }

        // ======================================================================
        //  登录 / 登出
        // ======================================================================
        async function doLogin() {
            const errEl = document.getElementById('loginError');
            try {
                const username = document.getElementById('loginUser').value.trim();
                const password = document.getElementById('loginPass').value.trim();
                if (!username || !password) { errEl.textContent = '请输入用户名和密码'; return; }
                const data = await apiRequest('/auth', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                localStorage.setItem('role', data.role);
                currentUser = { username: data.username, role: data.role };
                viewingUser = (data.role === 'admin') ? 'all' : data.username;
                errEl.textContent = '';
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                initApp();
            } catch (e) {
                errEl.textContent = e.message || '登录失败';
                console.error(e);
            }
        }

        function doLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            localStorage.removeItem('role');
            currentUser = null;
            viewingUser = 'all';
            document.getElementById('app').style.display = 'none';
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginError').textContent = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const loginPage = document.getElementById('loginPage');
                if (loginPage.style.display !== 'none') { e.preventDefault(); doLogin(); }
            }
        });

        // ======================================================================
        //  应用初始化
        // ======================================================================
        async function initApp() {
            if (!currentUser) { doLogout(); return; }
            document.getElementById('headerName').textContent = currentUser.username;
            document.getElementById('headerRole').textContent = currentUser.role === 'admin' ? '管理员' : '交易员';
            const container = document.getElementById('userSwitchContainer');
            if (currentUser.role === 'admin') {
                container.style.display = 'inline-block';
                await populateUserSwitch();
            } else {
                container.style.display = 'none';
            }
            const isAdmin = currentUser.role === 'admin';
            document.querySelectorAll('.sidebar .menu-item').forEach(item => {
                const page = item.dataset.page;
                if (page === 'home' || page === 'trades') { item.style.display = 'flex'; }
                else if (page === 'data' || page === 'users') { item.style.display = isAdmin ? 'flex' : 'none'; }
            });
            switchPage('home');
        }

        async function populateUserSwitch() {
            try {
                const users = await apiRequest('/users');
                const sel = document.getElementById('userSwitchSelect');
                sel.innerHTML = '';
                const allOpt = document.createElement('option');
                allOpt.value = 'all';
                allOpt.textContent = '📊 全部交易员';
                if (viewingUser === 'all') allOpt.selected = true;
                sel.appendChild(allOpt);
                users.forEach(u => {
                    if (u.role === 'trader') {
                        const opt = document.createElement('option');
                        opt.value = u.username;
                        opt.textContent = u.username;
                        if (u.username === viewingUser) opt.selected = true;
                        sel.appendChild(opt);
                    }
                });
            } catch (e) {
                console.warn('获取用户列表失败', e);
            }
        }

        function switchViewUser(username) {
            if (!currentUser || currentUser.role !== 'admin') return;
            viewingUser = username;
            renderPage(currentPage);
        }

        // ======================================================================
        //  页面路由
        // ======================================================================
        function switchPage(page) {
            currentPage = page;
            document.querySelectorAll('.sidebar .menu-item').forEach(el => {
                el.classList.toggle('active', el.dataset.page === page);
            });
            renderPage(page);
        }

        function renderPage(page) {
            const area = document.getElementById('contentArea');
            if (!area) return;
            area.innerHTML = '<div class="loading">加载中...</div>';
            try {
                switch (page) {
                    case 'home': renderHome(area); break;
                    case 'trades': renderTrades(area); break;
                    case 'data': renderData(area); break;
                    case 'users': renderUsers(area); break;
                    default: area.innerHTML = '<div class="empty-msg">页面不存在</div>';
                }
            } catch (e) {
                area.innerHTML = `<div class="empty-msg">渲染错误：${e.message}</div>`;
                console.error(e);
            }
        }

        // ======================================================================
        //  主页（修复：传递 user 参数）
        // ======================================================================
        async function renderHome(area) {
            try {
                let url = '/stats';
                if (viewingUser !== 'all') {
                    url += `?user=${viewingUser}`;
                }
                const stats = await apiRequest(url);
                const totalProfit = stats.totalProfit || 0;
                const totalFee = stats.totalFee || 0;
                const totalTrades = stats.totalTrades || 0;
                const winTrades = stats.winTrades || 0;
                const winRate = totalTrades > 0 ? (winTrades / totalTrades) * 100 : 0;
                const totalCapital = stats.totalCapital || 0;
                const equity = totalCapital + totalProfit;
                const profitRate = totalCapital > 0 ? (totalProfit / totalCapital) * 100 : 0;
                const profitFactor = (totalTrades > 0 && stats.totalLoss > 0) ? (stats.totalWin / stats.totalLoss).toFixed(2) : (stats.totalWin > 0 ? '∞' : '0');

                const label = viewingUser === 'all' ? '全部交易员' : viewingUser;
                area.innerHTML = `
                    <div class="page-title">📊 数据总览 <small>${label}</small></div>
                    <div class="kpi-grid">
                        <div class="kpi-card"><div class="label">当前权益</div><div class="value" style="color:${equity>=totalCapital?'var(--green-profit)':'var(--red-loss)'};">${formatCurrency(equity)}</div></div>
                        <div class="kpi-card"><div class="label">总盈亏金额</div><div class="value" style="color:${totalProfit>=0?'var(--green-profit)':'var(--red-loss)'};">${totalProfit>=0?'+':''}${formatCurrency(totalProfit)}</div></div>
                        <div class="kpi-card"><div class="label">盈亏比例</div><div class="value" style="color:${profitRate>=0?'var(--green-profit)':'var(--red-loss)'};">${profitRate>=0?'+':''}${profitRate.toFixed(2)}%</div></div>
                        <div class="kpi-card"><div class="label">交易胜率</div><div class="value">${winRate.toFixed(1)}%</div></div>
                        <div class="kpi-card"><div class="label">交易盈亏比</div><div class="value">${profitFactor}</div></div>
                        <div class="kpi-card"><div class="label">总手续费</div><div class="value">${formatCurrency(totalFee)}</div></div>
                        <div class="kpi-card"><div class="label">手续费占比</div><div class="value">-</div></div>
                    </div>
                    <div class="chart-main">
                        <div class="chart-left"><h4>📆 每月盈亏趋势</h4><canvas id="monthlyChart"></canvas></div>
                        <div class="chart-right">
                            <div class="chart-box"><h4>📅 每日盈亏趋势</h4><canvas id="dailyChart"></canvas></div>
                            <div class="chart-box"><h4>📈 每周净值（倍数）</h4><canvas id="weeklyChart"></canvas></div>
                        </div>
                    </div>
                    <div style="margin-top:16px;color:var(--text-secondary);font-size:13px;text-align:center;border-top:1px solid var(--border-color);padding-top:14px;">
                        知行合一 · ${new Date().toLocaleDateString()}
                    </div>
                `;
                // 图表绘制略（可扩展）
            } catch (e) {
                area.innerHTML = `<div class="empty-msg">加载数据失败：${e.message}</div>`;
            }
        }

        // ======================================================================
        //  交易记录
        // ======================================================================
        async function renderTrades(area) {
            try {
                let url = '/trades';
                if (viewingUser !== 'all') {
                    url += `?user=${viewingUser}`;
                }
                const trades = await apiRequest(url);
                const isAdmin = currentUser.role === 'admin';
                const label = viewingUser === 'all' ? '全部交易员' : viewingUser;
                let html = `<div class="page-title">📈 交易记录 <small>${label}</small></div>`;
                html += `<div class="toolbar">
                            <button class="btn btn-primary" onclick="openAddTrade()">＋ 添加记录</button>
                            <button class="btn btn-success" onclick="exportExcel()">📤 导出 Excel</button>
                            <span style="color:var(--text-secondary);font-size:13px;margin-left:auto;">共 ${trades.length} 条</span>
                        </div>`;
                if (trades.length === 0) {
                    html += `<div class="empty-msg">暂无交易记录</div>`;
                } else {
                    const sorted = trades.sort((a,b) => (a.date < b.date ? 1 : -1));
                    html += `<div class="scroll-wrap"><table><thead><tr>`;
                    if (viewingUser === 'all') html += `<th>交易员</th>`;
                    html += `<th>日期</th><th>品种</th><th>方向</th><th>止损</th><th>开仓价</th><th>手数</th><th>平仓价</th><th>盈亏</th><th>操作</th></tr></thead><tbody>`;
                    sorted.forEach(t => {
                        html += `<tr>`;
                        if (viewingUser === 'all') html += `<td>${t.username}</td>`;
                        html += `<td>${t.date}</td><td>${t.symbol}</td><td>${t.direction}</td>
                                <td>${t.stop_loss}</td><td>${t.open_price}</td><td>${t.volume}</td>
                                <td>${t.close_price || '—'}</td>
                                <td style="color:${t.profit>=0?'var(--green-profit)':'var(--red-loss)'};">${t.profit>=0?'+':''}${formatCurrency(t.profit)}</td>
                                <td>
                                    <button class="btn" style="padding:2px 10px;font-size:12px;color:var(--gold);" onclick="editTrade(${t.id})">✎</button>
                                    <button class="btn" style="padding:2px 10px;font-size:12px;color:var(--red-loss);" onclick="deleteTrade(${t.id})">✕</button>
                                </td>`;
                        html += `</tr>`;
                    });
                    html += `</tbody></table></div>`;
                }
                area.innerHTML = html;
            } catch (e) {
                area.innerHTML = `<div class="empty-msg">加载交易记录失败：${e.message}</div>`;
            }
        }

        // ----- 交易 CRUD (修复) -----
        function openAddTrade() {
            if (currentUser.role === 'admin' && viewingUser === 'all') {
                // 管理员在"全部"视图下需选择交易员
                openSelectTraderModal(function(username) {
                    if (username) {
                        openTradeModal(null, username);
                    }
                });
                return;
            }
            const username = (currentUser.role === 'admin') ? viewingUser : currentUser.username;
            if (!username) {
                alert('无法确定归属用户');
                return;
            }
            openTradeModal(null, username);
        }

        function editTrade(id) {
            // 简单处理：从当前列表获取（但列表可能未缓存），这里直接打开编辑，归属用户由后端根据权限决定
            // 由于我们无法从列表缓存，我们仅弹窗，保存时后端会校验权限
            // 但我们需要知道归属用户以便显示，可使用调用API获取单条，但为简化，我们允许编辑时由后端决定
            // 我们将_editingUsername置空，保存时使用当前用户或管理员指定
            // 更好的做法是查询 /trades/${id}，但为了简短，我们直接打开模态框，保存时由后端处理
            openTradeModal(id, null); // 传递null表示由后端决定
        }

        function openTradeModal(tradeId, username) {
            _editingUsername = username; // 存储，用于保存时传递
            const modal = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            const title = tradeId ? '编辑交易记录' : '添加交易记录';
            const userDisplay = username ? `（${username}）` : '';
            box.innerHTML = `
                <h3>${title} ${userDisplay}</h3>
                <label>日期 *</label>
                <input id="mTradeDate" type="date" value="${new Date().toISOString().slice(0,10)}">
                <label>交易品种 *</label>
                <input id="mTradeSymbol" value="XAUUSD">
                <label>交易方向 *</label>
                <select id="mTradeDirection"><option value="买入">买入</option><option value="卖出">卖出</option></select>
                <label>止损位 *</label>
                <input id="mTradeStop" type="number" step="any" placeholder="1950">
                <label>开仓价 *</label>
                <input id="mTradeOpen" type="number" step="any" placeholder="1960.5">
                <label>开仓手数 *</label>
                <input id="mTradeVolume" type="number" step="any" placeholder="1.0">
                <label>平仓价（可选）</label>
                <input id="mTradeClose" type="number" step="any" placeholder="留空表示未平仓">
                <div class="btn-row">
                    <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                    <button class="btn btn-confirm" onclick="saveTrade(${tradeId || 'null'})">保存</button>
                </div>
            `;
            modal.classList.add('open');
        }

        async function saveTrade(id) {
            const date = document.getElementById('mTradeDate').value;
            const symbol = document.getElementById('mTradeSymbol').value.trim();
            const direction = document.getElementById('mTradeDirection').value;
            const stop_loss = parseFloat(document.getElementById('mTradeStop').value);
            const open_price = parseFloat(document.getElementById('mTradeOpen').value);
            const volume = parseFloat(document.getElementById('mTradeVolume').value);
            const close_price_raw = document.getElementById('mTradeClose').value.trim();
            const close_price = close_price_raw === '' ? null : parseFloat(close_price_raw);
            if (!date || !symbol || isNaN(stop_loss) || isNaN(open_price) || isNaN(volume)) {
                alert('请完整填写必填项');
                return;
            }
            const tradeData = { date, symbol, direction, stop_loss, open_price, volume, close_price };
            // 如果有指定用户名，则传递（管理员场景）
            if (_editingUsername) {
                tradeData.username = _editingUsername;
            }
            try {
                if (id) {
                    // 编辑时需要传递id，但后端PUT需要将id放在body或URL，我们放在URL参数
                    await apiRequest(`/trades/${id}`, { method: 'PUT', body: JSON.stringify(tradeData) });
                } else {
                    await apiRequest('/trades', { method: 'POST', body: JSON.stringify(tradeData) });
                }
                closeModal();
                renderPage(currentPage);
            } catch (e) {
                alert('保存失败：' + e.message);
            }
        }

        async function deleteTrade(id) {
            if (!confirm('确认删除？')) return;
            try {
                await apiRequest(`/trades/${id}`, { method: 'DELETE' });
                renderPage(currentPage);
            } catch (e) {
                alert('删除失败：' + e.message);
            }
        }

        // ----- 选择交易员模态框 -----
        function openSelectTraderModal(callback) {
            apiRequest('/users').then(users => {
                const traders = users.filter(u => u.role === 'trader');
                if (traders.length === 0) {
                    alert('没有交易员用户');
                    return;
                }
                const modal = document.getElementById('modalOverlay');
                const box = document.getElementById('modalBox');
                box.innerHTML = `
                    <h3>选择交易员</h3>
                    <select id="traderSelect" style="width:100%;padding:8px;margin-top:12px;">
                        ${traders.map(u => `<option value="${u.username}">${u.username}</option>`).join('')}
                    </select>
                    <div class="btn-row">
                        <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                        <button class="btn btn-confirm" onclick="confirmTraderSelection()">确认</button>
                    </div>
                `;
                modal.classList.add('open');
                window.confirmTraderSelection = function() {
                    const sel = document.getElementById('traderSelect');
                    const username = sel.value;
                    closeModal();
                    if (callback) callback(username);
                };
            }).catch(err => alert('获取用户列表失败：' + err.message));
        }

        // ----- 导出（占位） -----
        function exportExcel() {
            alert('导出功能暂未实现');
        }

        // ======================================================================
        //  数据维护（管理员）
        // ======================================================================
        async function renderData(area) {
            if (currentUser.role !== 'admin') {
                area.innerHTML = `<div class="page-title">⚙️ 数据维护</div><div class="empty-msg">权限不足</div>`;
                return;
            }
            try {
                const users = await apiRequest('/users');
                const symbols = await apiRequest('/symbols');
                let html = `<div class="page-title">⚙️ 数据维护 <small>交易员资金 & 品种参数</small></div>
                            <div style="margin-bottom:16px;background:var(--bg-card);padding:16px;border-radius:var(--radius);border:1px solid var(--border-color);">
                                <h4 style="color:var(--gold);margin-bottom:12px;">💰 交易员初始资金</h4>
                                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;">`;
                users.filter(u => u.role === 'trader').forEach(u => {
                    html += `<div style="display:flex;align-items:center;gap:8px;background:var(--bg-input);padding:8px 12px;border-radius:6px;">
                                <span style="font-weight:600;min-width:60px;">${u.username}</span>
                                <input type="number" step="any" value="${u.initial_capital}" id="cap_${u.username}" style="flex:1;padding:4px 8px;">
                                <button class="btn" style="padding:2px 12px;background:var(--gold);color:#0b0e14;" onclick="saveUserCapital('${u.username}')">保存</button>
                            </div>`;
                });
                html += `</div></div>
                            <div style="margin-top:12px;">
                                <div class="toolbar">
                                    <button class="btn btn-primary" onclick="openAddSymbol()">＋ 添加品种</button>
                                    <button class="btn btn-success" onclick="exportSymbols()">📤 导出品种</button>
                                    <span style="color:var(--text-secondary);font-size:13px;margin-left:auto;">共 ${symbols.length} 个品种</span>
                                </div>
                                ${symbols.length === 0 ? '<div class="empty-msg">暂无品种配置</div>' :
                                    `<div class="scroll-wrap"><table><thead><tr><th>品种</th><th>点值</th><th>最小跳动</th><th>开仓费率</th><th>平仓费率</th><th>操作</th></tr></thead><tbody>
                                    ${symbols.map(s => `<tr>
                                        <td><strong>${s.symbol}</strong></td>
                                        <td>${s.point_value}</td>
                                        <td>${s.tick_size}</td>
                                        <td>${s.open_fee_rate}</td>
                                        <td>${s.close_fee_rate}</td>
                                        <td>
                                            <button class="btn" style="padding:2px 10px;font-size:12px;color:var(--gold);" onclick="editSymbol('${s.symbol}')">✎</button>
                                            <button class="btn" style="padding:2px 10px;font-size:12px;color:var(--red-loss);" onclick="deleteSymbol('${s.symbol}')">✕</button>
                                        </td>
                                    </tr>`).join('')}</tbody></table></div>`
                                }
                            </div>`;
                area.innerHTML = html;
            } catch (e) {
                area.innerHTML = `<div class="empty-msg">加载数据失败：${e.message}</div>`;
            }
        }

        async function saveUserCapital(username) {
            const inp = document.getElementById('cap_' + username);
            const val = parseFloat(inp.value);
            if (isNaN(val) || val < 0) { alert('请输入有效金额'); return; }
            try {
                await apiRequest('/users/capital', { method: 'PUT', body: JSON.stringify({ username, initial_capital: val }) });
                alert('保存成功');
                renderPage(currentPage);
            } catch (e) {
                alert('保存失败：' + e.message);
            }
        }

        // 品种管理
        function openAddSymbol() {
            const modal = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            box.innerHTML = `
                <h3>添加品种</h3>
                <label>交易品种</label><input id="mSymSymbol">
                <label>点值</label><input id="mSymPoint" type="number" step="any">
                <label>最小跳动点数</label><input id="mSymTick" type="number" step="any">
                <label>开仓手续费率</label><input id="mSymOpenRate" type="number" step="any">
                <label>平仓手续费率</label><input id="mSymCloseRate" type="number" step="any">
                <div class="btn-row">
                    <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                    <button class="btn btn-confirm" onclick="saveSymbol()">保存</button>
                </div>
            `;
            modal.classList.add('open');
        }

        async function saveSymbol() {
            const symbol = document.getElementById('mSymSymbol').value.trim();
            const point_value = parseFloat(document.getElementById('mSymPoint').value);
            const tick_size = parseFloat(document.getElementById('mSymTick').value);
            const open_fee_rate = parseFloat(document.getElementById('mSymOpenRate').value);
            const close_fee_rate = parseFloat(document.getElementById('mSymCloseRate').value);
            if (!symbol || isNaN(point_value) || isNaN(tick_size) || isNaN(open_fee_rate) || isNaN(close_fee_rate)) {
                alert('请完整填写');
                return;
            }
            try {
                await apiRequest('/symbols', { method: 'POST', body: JSON.stringify({ symbol, point_value, tick_size, open_fee_rate, close_fee_rate }) });
                closeModal();
                renderPage(currentPage);
            } catch (e) {
                alert('保存失败：' + e.message);
            }
        }

        async function deleteSymbol(symbol) {
            if (!confirm(`确认删除品种「${symbol}」？`)) return;
            try {
                await apiRequest(`/symbols/${symbol}`, { method: 'DELETE' });
                renderPage(currentPage);
            } catch (e) {
                alert('删除失败：' + e.message);
            }
        }

        function exportSymbols() {
            alert('导出功能暂未实现');
        }

        // ======================================================================
        //  用户管理（管理员）
        // ======================================================================
        async function renderUsers(area) {
            if (currentUser.role !== 'admin') {
                area.innerHTML = `<div class="page-title">👥 用户管理</div><div class="empty-msg">权限不足</div>`;
                return;
            }
            try {
                const users = await apiRequest('/users');
                let html = `<div class="page-title">👥 用户管理</div>
                            <div class="toolbar">
                                <button class="btn btn-primary" onclick="openAddUser()">＋ 新增用户</button>
                                <span style="color:var(--text-secondary);font-size:13px;margin-left:auto;">共 ${users.length} 个用户</span>
                            </div>
                            <div class="scroll-wrap"><table><thead><tr><th>用户名</th><th>角色</th><th>初始资金</th><th>密码</th><th>操作</th></tr></thead><tbody>`;
                users.forEach(u => {
                    html += `<tr>
                                <td><strong>${u.username}</strong></td>
                                <td>${u.role === 'admin' ? '管理员' : '交易员'}</td>
                                <td>${u.role === 'admin' ? '—' : formatCurrency(u.initial_capital)}</td>
                                <td><code style="background:var(--bg-input);padding:2px 10px;border-radius:4px;">****</code></td>
                                <td>
                                    <button class="btn" style="padding:2px 10px;font-size:12px;color:var(--gold);" onclick="openEditUserPwd('${u.username}')">🔑 改密</button>
                                    ${u.username === 'admin' ? '' : `<button class="btn" style="padding:2px 10px;font-size:12px;color:var(--red-loss);" onclick="deleteUser('${u.username}')">✕ 删除</button>`}
                                </td>
                            </tr>`;
                });
                html += `</tbody></table></div>`;
                area.innerHTML = html;
            } catch (e) {
                area.innerHTML = `<div class="empty-msg">加载用户失败：${e.message}</div>`;
            }
        }

        function openAddUser() {
            const modal = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            box.innerHTML = `
                <h3>新增用户</h3>
                <label>用户名</label><input id="mNewUser">
                <label>密码</label><input id="mNewPass" type="text">
                <label>角色</label>
                <select id="mNewRole">
                    <option value="trader">交易员</option>
                    <option value="admin">管理员</option>
                </select>
                <div id="capitalInputGroup">
                    <label>初始资金（仅交易员）</label>
                    <input id="mNewCapital" type="number" step="any" value="50000">
                </div>
                <div class="btn-row">
                    <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                    <button class="btn btn-confirm" onclick="saveNewUser()">添加</button>
                </div>
            `;
            modal.classList.add('open');
            document.getElementById('capitalInputGroup').style.display = 'block';
            document.getElementById('mNewRole').onchange = function() {
                document.getElementById('capitalInputGroup').style.display = (this.value === 'trader') ? 'block' : 'none';
            };
        }

        async function saveNewUser() {
            const username = document.getElementById('mNewUser').value.trim();
            const password = document.getElementById('mNewPass').value.trim();
            const role = document.getElementById('mNewRole').value;
            const initial_capital = role === 'trader' ? parseFloat(document.getElementById('mNewCapital').value) || 50000 : 0;
            if (!username || !password) { alert('请填写完整'); return; }
            try {
                await apiRequest('/users', { method: 'POST', body: JSON.stringify({ username, password, role, initial_capital }) });
                closeModal();
                renderPage(currentPage);
                populateUserSwitch();
            } catch (e) {
                alert('添加失败：' + e.message);
            }
        }

        async function deleteUser(username) {
            if (!confirm(`删除用户「${username}」？`)) return;
            try {
                await apiRequest(`/users/${username}`, { method: 'DELETE' });
                renderPage(currentPage);
                populateUserSwitch();
            } catch (e) {
                alert('删除失败：' + e.message);
            }
        }

        function openEditUserPwd(username) {
            const modal = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            box.innerHTML = `
                <h3>修改密码 - ${username}</h3>
                <label>新密码</label><input id="mEditPwd" type="text">
                <div class="btn-row">
                    <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                    <button class="btn btn-confirm" onclick="saveEditUserPwd('${username}')">保存</button>
                </div>
            `;
            modal.classList.add('open');
        }

        async function saveEditUserPwd(username) {
            const newPwd = document.getElementById('mEditPwd').value.trim();
            if (!newPwd) { alert('请输入新密码'); return; }
            try {
                await apiRequest(`/users/${username}/password`, { method: 'PUT', body: JSON.stringify({ password: newPwd }) });
                closeModal();
                renderPage(currentPage);
            } catch (e) {
                alert('修改失败：' + e.message);
            }
        }

        // ======================================================================
        //  模态框工具
        // ======================================================================
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ======================================================================
        //  启动（自动检测是否登录）
        // ======================================================================
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token');
            const username = localStorage.getItem('username');
            const role = localStorage.getItem('role');
            if (token && username && role) {
                currentUser = { username, role };
                viewingUser = (role === 'admin') ? 'all' : username;
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                initApp();
            } else {
                document.getElementById('loginPage').style.display = 'flex';
                document.getElementById('app').style.display = 'none';
            }
        });
    </script>
</body>
</html>
