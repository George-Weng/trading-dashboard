<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易数据分析看板 - 云端版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-dark: #0b0e14; --bg-card: #131a22; --bg-input: #1c2632;
            --border-color: #2a3a4a; --text-primary: #e8edf2; --text-secondary: #8a9aa8;
            --gold: #d4a843; --gold-dim: #a5832e;
            --green-profit: #4ecdc4; --red-loss: #ff6b6b;
            --shadow: 0 8px 32px rgba(0,0,0,0.6); --radius: 10px; --transition: 0.25s ease;
        }
        html, body { height:100%; font-family:'Segoe UI','PingFang SC',Roboto,sans-serif; background:var(--bg-dark); color:var(--text-primary); }
        button { cursor:pointer; font-family:inherit; border:none; outline:none; }
        input, select { font-family:inherit; outline:none; border:none; background:var(--bg-input); color:var(--text-primary); padding:8px 12px; border-radius:6px; border:1px solid var(--border-color); transition:var(--transition); }
        input:focus, select:focus { border-color:var(--gold); box-shadow:0 0 0 2px rgba(212,168,67,0.25); }
        table { width:100%; border-collapse:collapse; font-size:14px; }
        th { background:var(--bg-input); color:var(--gold); font-weight:600; padding:10px 8px; text-align:left; border-bottom:2px solid var(--gold-dim); white-space:nowrap; }
        td { padding:8px 8px; border-bottom:1px solid var(--border-color); white-space:nowrap; }
        tr:hover td { background:rgba(212,168,67,0.04); }
        .scroll-wrap { overflow-x:auto; padding-bottom:4px; }
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-track { background:var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background:var(--gold-dim); border-radius:6px; }
        ::-webkit-scrollbar-thumb:hover { background:var(--gold); }
        #loginPage { display:flex; justify-content:center; align-items:center; height:100vh; background:radial-gradient(ellipse at 30% 40%, #16212b, #080b10); }
        .login-box { background:var(--bg-card); padding:48px 40px 40px; border-radius:var(--radius); box-shadow:var(--shadow); width:400px; border:1px solid var(--border-color); position:relative; }
        .login-box h1 { font-size:28px; font-weight:300; text-align:center; margin-bottom:6px; letter-spacing:2px; }
        .login-box h1 span { color:var(--gold); font-weight:600; }
        .login-box .sub { text-align:center; color:var(--text-secondary); font-size:14px; margin-bottom:28px; border-bottom:1px solid var(--border-color); padding-bottom:18px; }
        .login-box label { display:block; font-size:13px; color:var(--text-secondary); margin-bottom:4px; margin-top:14px; }
        .login-box input { width:100%; padding:10px 14px; font-size:15px; }
        .login-box .btn-login { width:100%; padding:12px; margin-top:26px; background:var(--gold); color:#0b0e14; font-size:17px; font-weight:700; border-radius:6px; transition:var(--transition); letter-spacing:1px; }
        .login-box .btn-login:hover { background:#e8c85a; transform:translateY(-1px); box-shadow:0 4px 20px rgba(212,168,67,0.3); }
        .login-box .error { color:var(--red-loss); font-size:14px; text-align:center; margin-top:12px; min-height:22px; }
        #app { display:none; height:100vh; flex-direction:column; background:var(--bg-dark); }
        .header { background:var(--bg-card); padding:12px 28px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); flex-shrink:0; flex-wrap:wrap; gap:8px 16px; }
        .header .user-info { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
        .header .user-info .name { font-size:18px; font-weight:600; }
        .header .user-info .role-badge { background:var(--gold-dim); color:#fff; font-size:12px; padding:2px 14px; border-radius:20px; font-weight:600; letter-spacing:0.5px; }
        .header .slogan { color:var(--gold); font-size:18px; font-weight:500; letter-spacing:1px; text-shadow:0 0 12px rgba(212,168,67,0.15); flex:1; text-align:center; min-width:180px; }
        .header .actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        .header .actions select { background:var(--bg-input); color:var(--text-primary); border:1px solid var(--border-color); padding:4px 8px; border-radius:4px; font-size:13px; }
        .header .actions button { background:transparent; color:var(--text-secondary); padding:6px 16px; border-radius:6px; border:1px solid var(--border-color); font-size:13px; transition:var(--transition); }
        .header .actions button:hover { border-color:var(--gold); color:var(--gold); background:rgba(212,168,67,0.08); }
        .header .actions .logout-btn { border-color:#5a2a2a; color:var(--red-loss); }
        .header .actions .logout-btn:hover { border-color:var(--red-loss); background:rgba(255,107,107,0.08); }
        .main-body { display:flex; flex:1; overflow:hidden; }
        .sidebar { width:10%; min-width:80px; background:var(--bg-card); border-right:1px solid var(--border-color); padding:16px 0; flex-shrink:0; overflow-y:auto; }
        .sidebar .menu-item { padding:12px 10px; font-size:14px; color:var(--text-secondary); cursor:pointer; transition:var(--transition); border-left:3px solid transparent; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; }
        .sidebar .menu-item .icon { font-size:20px; }
        .sidebar .menu-item .label { font-size:11px; line-height:1.2; }
        .sidebar .menu-item:hover { background:rgba(212,168,67,0.06); color:var(--text-primary); }
        .sidebar .menu-item.active { color:var(--gold); border-left-color:var(--gold); background:rgba(212,168,67,0.08); }
        .content { flex:1; padding:20px 28px; overflow-y:auto; background:var(--bg-dark); }
        .content .page-title { font-size:22px; font-weight:300; margin-bottom:18px; color:var(--text-primary); border-bottom:1px solid var(--border-color); padding-bottom:10px; }
        .content .page-title small { color:var(--text-secondary); font-size:14px; font-weight:400; margin-left:12px; }
        .toolbar { display:flex; flex-wrap:wrap; gap:10px 16px; margin-bottom:16px; align-items:center; }
        .toolbar .btn { padding:7px 18px; border-radius:6px; font-size:13px; font-weight:600; transition:var(--transition); background:var(--bg-input); color:var(--text-primary); border:1px solid var(--border-color); }
        .toolbar .btn:hover { border-color:var(--gold); color:var(--gold); }
        .toolbar .btn-primary { background:var(--gold); color:#0b0e14; border-color:var(--gold); }
        .toolbar .btn-primary:hover { background:#e8c85a; border-color:#e8c85a; color:#0b0e14; }
        .toolbar .btn-success { border-color:#2a6a5a; color:var(--green-profit); }
        .toolbar .btn-success:hover { background:rgba(78,205,196,0.08); border-color:var(--green-profit); }
        .toolbar .btn-danger { border-color:#5a2a2a; color:var(--red-loss); }
        .toolbar .btn-danger:hover { background:rgba(255,107,107,0.1); border-color:var(--red-loss); }
        .empty-msg { color:var(--text-secondary); text-align:center; padding:40px 0; font-size:15px; }
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); z-index:999; justify-content:center; align-items:center; }
        .modal-overlay.open { display:flex; }
        .modal-box { background:var(--bg-card); border-radius:var(--radius); box-shadow:var(--shadow); padding:32px 36px; max-width:640px; width:92%; max-height:90vh; overflow-y:auto; border:1px solid var(--border-color); }
        .modal-box h3 { font-size:20px; font-weight:400; margin-bottom:18px; color:var(--gold); }
        .modal-box label { display:block; font-size:13px; color:var(--text-secondary); margin-top:12px; margin-bottom:4px; }
        .modal-box input, .modal-box select { width:100%; padding:8px 12px; }
        .modal-box .btn-row { display:flex; gap:12px; margin-top:22px; justify-content:flex-end; }
        .modal-box .btn-row .btn { padding:8px 28px; border-radius:6px; font-weight:600; font-size:14px; }
        .modal-box .btn-row .btn-cancel { background:transparent; color:var(--text-secondary); border:1px solid var(--border-color); }
        .modal-box .btn-row .btn-cancel:hover { border-color:var(--text-secondary); }
        .modal-box .btn-row .btn-confirm { background:var(--gold); color:#0b0e14; }
        .modal-box .btn-row .btn-confirm:hover { background:#e8c85a; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 24px; }
        .kpi-card { background: var(--bg-card); padding: 14px 12px; border-radius: var(--radius); border: 1px solid var(--border-color); text-align: center; }
        .kpi-card .label { color: var(--text-secondary); font-size: 13px; }
        .kpi-card .value { font-size: clamp(18px, 2.2vw, 24px); font-weight: 600; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .loading { text-align:center; padding:40px 0; color:var(--text-secondary); }

        .chart-main { display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap; height: 710px; align-items: stretch; }
        .chart-left { flex: 0 0 25%; min-width: 220px; background: var(--bg-card); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; height: 100%; }
        .chart-left h4 { color: var(--text-secondary); font-weight: 400; text-align: center; margin-bottom: 10px; flex-shrink: 0; }
        .chart-left canvas { flex: 1; width: 100% !important; height: 100% !important; min-height: 0; }
        .chart-right { flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 20px; height: 100%; }
        .chart-box { background: var(--bg-card); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border-color); flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
        .chart-box h4 { color: var(--text-secondary); font-weight: 400; margin-bottom: 10px; text-align: center; flex-shrink: 0; }
        .chart-box canvas { flex: 1; width: 100% !important; height: 100% !important; min-height: 0; }

        @media (max-width:820px) {
            .sidebar { width:120px; min-width:80px; }
            .sidebar .menu-item { padding:8px 6px; font-size:12px; }
            .sidebar .menu-item .icon { font-size:18px; }
            .sidebar .menu-item .label { font-size:10px; }
            .header .slogan { font-size:14px; min-width:120px; }
            .content { padding:14px 16px; }
            .login-box { padding:32px 24px; width:92%; }
            .modal-box { padding:24px 20px; }
            .kpi-grid { grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); }
            .chart-main { height:auto; flex-direction:column; }
            .chart-left { flex:0 0 auto; height:520px; min-width:unset; }
            .chart-right { height:auto; min-height:780px; }
            .chart-box { min-height:320px; }
        }
        @media (max-width:600px) {
            .sidebar { width:100%; min-width:unset; border-right:none; border-bottom:1px solid var(--border-color); padding:8px 0; display:flex; flex-wrap:wrap; gap:2px; }
            .sidebar .menu-item { padding:6px 10px; font-size:12px; border-left:none; border-bottom:2px solid transparent; flex:1 0 auto; flex-direction:row; gap:6px; justify-content:center; }
            .sidebar .menu-item .icon { font-size:16px; }
            .sidebar .menu-item .label { font-size:11px; }
            .sidebar .menu-item.active { border-left:none; border-bottom-color:var(--gold); }
            .main-body { flex-direction:column; }
            .content { padding:12px 14px; }
            .header { padding:10px 14px; flex-direction:column; align-items:stretch; gap:6px; }
            .header .slogan { font-size:14px; text-align:center; order:2; }
            .header .user-info { order:1; justify-content:center; }
            .header .actions { order:3; justify-content:center; }
            .kpi-grid { grid-template-columns:1fr 1fr; }
            .chart-main { height:auto; flex-direction:column; }
            .chart-left { height:420px; }
            .chart-right { height:auto; }
            .chart-box { min-height:260px; }
        }
    </style>
</head>
<body>
    <div id="loginPage">
        <div class="login-box">
            <h1>📊 <span>交易看板</span></h1>
            <div class="sub">云端版 · 数据持久化</div>
            <label>用户名</label>
            <input id="loginUser" type="text" placeholder="请输入用户名">
            <label>密码</label>
            <input id="loginPass" type="password" placeholder="请输入密码">
            <button class="btn-login" onclick="doLogin()">登 录</button>
            <div class="error" id="loginError"></div>
        </div>
    </div>

    <div id="app">
        <header class="header">
            <div class="user-info">
                <span class="name" id="headerName">—</span>
                <span class="role-badge" id="headerRole">—</span>
            </div>
            <div class="slogan">⚡ 该进进、该出出、不做判断、只做跟随！</div>
            <div class="actions">
                <span id="userSwitchContainer" style="display:none;">
                    <label style="color:var(--text-secondary);font-size:13px;">查看用户：</label>
                    <select id="userSwitchSelect" onchange="switchViewUser(this.value)"></select>
                </span>
                <button onclick="openChangePwd()">🔑 修改密码</button>
                <button class="logout-btn" onclick="doLogout()">退出</button>
            </div>
        </header>
        <div class="main-body">
            <nav class="sidebar" id="sidebar">
                <div class="menu-item active" data-page="home" onclick="switchPage('home')">
                    <span class="icon">🏠</span><span class="label">主页</span>
                </div>
                <div class="menu-item" data-page="trades" onclick="switchPage('trades')">
                    <span class="icon">📈</span><span class="label">交易记录</span>
                </div>
                <div class="menu-item" data-page="data" onclick="switchPage('data')">
                    <span class="icon">⚙️</span><span class="label">数据维护</span>
                </div>
                <div class="menu-item" data-page="users" onclick="switchPage('users')">
                    <span class="icon">👥</span><span class="label">用户管理</span>
                </div>
            </nav>
            <div class="content" id="contentArea">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox"></div>
    </div>

    <script>
        // ======================================================================
        //  API 客户端
        // ======================================================================
        const API_BASE = '/api';
        async function apiRequest(endpoint, options = {}) {
            const token = localStorage.getItem('token');
            const headers = {
                'Content-Type': 'application/json',
                ...(token && { 'Authorization': `Bearer ${token}` }),
                ...options.headers
            };
            const response = await fetch(`${API_BASE}${endpoint}`, {
                ...options,
                headers
            });
            if (!response.ok) {
                const error = await response.json().catch(() => ({}));
                throw new Error(error.error || '请求失败');
            }
            return response.json();
        }

        // ======================================================================
        //  工具
        // ======================================================================
        function formatCurrency(n) {
            if (n === undefined || n === null || isNaN(n)) return '—';
            let parts = n.toFixed(2).split('.');
            let intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return intPart + '.' + parts[1];
        }

        // ======================================================================
        //  会话
        // ======================================================================
        let currentUser = null;
        let viewingUser = 'all';
        let currentPage = 'home';
        let _editingUsername = null;
        let _symbolList = [];

        // ======================================================================
        //  登录 / 登出
        // ======================================================================
        async function doLogin() {
            const errEl = document.getElementById('loginError');
            try {
                const username = document.getElementById('loginUser').value.trim();
                const password = document.getElementById('loginPass').value.trim();
                if (!username || !password) { errEl.textContent = '请输入用户名和密码'; return; }
                const data = await apiRequest('/auth', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                localStorage.setItem('role', data.role);
                currentUser = { username: data.username, role: data.role };
                viewingUser = (data.role === 'admin') ? 'all' : data.username;
                errEl.textContent = '';
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                initApp();
            } catch (e) {
                errEl.textContent = e.message || '登录失败';
                console.error(e);
            }
        }

        function doLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            localStorage.removeItem('role');
            currentUser = null;
            viewingUser = 'all';
            document.getElementById('app').style.display = 'none';
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginError').textContent = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const loginPage = document.getElementById('loginPage');
                if (loginPage.style.display !== 'none') { e.preventDefault();
                    doLogin(); }
            }
        });

        // ======================================================================
        //  应用初始化
        // ======================================================================
        async function initApp() {
            if (!currentUser) { doLogout(); return; }
            const nameEl = document.getElementById('headerName');
            const roleEl = document.getElementById('headerRole');
            if (nameEl) nameEl.textContent = currentUser.username;
            if (roleEl) roleEl.textContent = currentUser.role === 'admin' ? '管理员' : '交易员';

            try {
                _symbolList = await apiRequest('/symbols');
            } catch (e) {
                console.warn('加载品种列表失败', e);
                _symbolList = [];
            }

            const container = document.getElementById('userSwitchContainer');
            if (currentUser.role === 'admin') {
                if (container) container.style.display = 'inline-block';
                await populateUserSwitch();
            } else {
                if (container) container.style.display = 'none';
            }

            const isAdmin = currentUser.role === 'admin';
            document.querySelectorAll('.sidebar .menu-item').forEach(item => {
                const page = item.dataset.page;
                if (page === 'home' || page === 'trades') { item.style.display = 'flex'; }
                else if (page === 'data' || page === 'users') { item.style.display = isAdmin ? 'flex' : 'none'; }
            });
            switchPage('home');
        }

        async function populateUserSwitch() {
            try {
                const users = await apiRequest('/users');
                const sel = document.getElementById('userSwitchSelect');
                if (!sel) return;
                sel.innerHTML = '';
                const allOpt = document.createElement('option');
                allOpt.value = 'all';
                allOpt.textContent = '📊 全部交易员';
                if (viewingUser === 'all') allOpt.selected = true;
                sel.appendChild(allOpt);
                users.forEach(u => {
                    if (u.role === 'trader') {
                        const opt = document.createElement('option');
                        opt.value = u.username;
                        opt.textContent = u.username;
                        if (u.username === viewingUser) opt.selected = true;
                        sel.appendChild(opt);
                    }
                });
            } catch (e) {
                console.warn('获取用户列表失败', e);
            }
        }

        function switchViewUser(username) {
            if (!currentUser || currentUser.role !== 'admin') return;
            viewingUser = username;
            renderPage(currentPage);
        }

        // ======================================================================
        //  页面路由
        // ======================================================================
        function switchPage(page) {
            currentPage = page;
            document.querySelectorAll('.sidebar .menu-item').forEach(el => {
                el.classList.toggle('active', el.dataset.page === page);
            });
            renderPage(page);
        }

        function renderPage(page) {
            const area = document.getElementById('contentArea');
            if (!area) return;
            area.innerHTML = '<div class="loading">加载中...</div>';
            try {
                switch (page) {
                    case 'home':
                        renderHome(area);
                        break;
                    case 'trades':
                        renderTrades(area);
                        break;
                    case 'data':
                        renderData(area);
                        break;
                    case 'users':
                        renderUsers(area);
                        break;
                    default:
                        area.innerHTML = '<div class="empty-msg">页面不存在</div>';
                }
            } catch (e) {
                area.innerHTML = `<div class="empty-msg">渲染错误：${e.message}</div>`;
                console.error(e);
            }
        }

        // ======================================================================
        //  主页 (含图表)
        // ======================================================================
        async function renderHome(area) {
            try {
                let url = '/stats';
                if (viewingUser !== 'all') {
                    url += `?user=${viewingUser}`;
                }
                const stats = await apiRequest(url);
                const kpi = stats.kpi || {};
                const totalProfit = kpi.totalProfit || 0;
                const totalFee = kpi.totalFee || 0;
                const totalTrades = kpi.totalTrades || 0;
                const winTrades = kpi.winTrades || 0;
                const winRate = totalTrades > 0 ? (winTrades / totalTrades) * 100 : 0;
                const totalCapital = kpi.totalCapital || 0;
                const equity = totalCapital + totalProfit;
                const profitRate = totalCapital > 0 ? (totalProfit / totalCapital) * 100 : 0;
                const profitFactor = (totalTrades > 0 && kpi.totalLoss > 0) ? (kpi.totalWin / kpi.totalLoss).toFixed(2) : (kpi.totalWin > 0 ? '∞' : '0');
                const feeRatio = (kpi.totalWin > 0) ? ((totalFee / kpi.totalWin) * 100).toFixed(2) + '%' : '-';

                const label = viewingUser === 'all' ? '全部交易员' : viewingUser;
                area.innerHTML = `
                    <div class="page-title">📊 数据总览 <small>${label}</small></div>
                    <div class="kpi-grid">
                        <div class="kpi-card"><div class="label">当前权益</div><div class="value" style="color:${equity>=totalCapital?'var(--red-loss)':'var(--green-profit)'};">${formatCurrency(equity)}</div></div>
                        <div class="kpi-card"><div class="label">总盈亏金额</div><div class="value" style="color:${totalProfit>=0?'var(--red-loss)':'var(--green-profit)'};">${totalProfit>=0?'+':''}${formatCurrency(totalProfit)}</div></div>
                        <div class="kpi-card"><div class="label">盈亏比例</div><div class="value" style="color:${profitRate>=0?'var(--red-loss)':'var(--green-profit)'};">${profitRate>=0?'+':''}${profitRate.toFixed(2)}%</div></div>
                        <div class="kpi-card"><div class="label">交易胜率</div><div class="value">${winRate.toFixed(1)}%</div></div>
                        <div class="kpi-card"><div class="label">交易盈亏比</div><div class="value">${profitFactor}</div></div>
                        <div class="kpi-card"><div class="label">总手续费</div><div class="value">${formatCurrency(totalFee)}</div></div>

        // ======================================================================
        //  绘制图表函数（盈利红，亏损绿，周净值增强）
        // ======================================================================
        function drawCharts(data) {
            function getBarColors(arr, pos = '#ff6b6b', neg = '#4ecdc4') {
                return arr.map(v => v > 0 ? pos : (v < 0 ? neg : '#666666'));
            }

            // 月盈亏
            const monthlyCtx = document.getElementById('monthlyChart');
            if (monthlyCtx && data.monthly) {
                try {
                    new Chart(monthlyCtx, {
                        type: 'bar',
                        data: {
                            labels: data.monthly.labels || ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
                            datasets: [{
                                label: '月盈亏',
                                data: data.monthly.data || [],
                                backgroundColor: getBarColors(data.monthly.data || []),
                                borderWidth: 1
                            }]
                        },
                        options: {
                            indexAxis: 'y',
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                y: { ticks: { color: '#8a9aa8', font: { size: 10 } }, grid: { display: false } },
                                x: { ticks: { color: '#8a9aa8' }, grid: { color: '#2a3a4a' } }
                            }
                        }
                    });
                } catch (e) { console.warn('月度图表绘制失败:', e); }
            }

            // 日盈亏
            const dailyCtx = document.getElementById('dailyChart');
            if (dailyCtx && data.daily) {
                try {
                    new Chart(dailyCtx, {
                        type: 'bar',
                        data: {
                            labels: data.daily.labels || [],
                            datasets: [{
                                label: '日盈亏',
                                data: data.daily.data || [],
                                backgroundColor: getBarColors(data.daily.data || []),
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                y: { ticks: { color: '#8a9aa8' }, grid: { color: '#2a3a4a' } },
                                x: { ticks: { color: '#8a9aa8', maxTicksLimit: 10 } }
                            }
                        }
                    });
                } catch (e) { console.warn('日盈亏图表绘制失败:', e); }
            }

            // 周净值（增强健壮性）
            const weeklyCtx = document.getElementById('weeklyChart');
            if (weeklyCtx && data.weekly) {
                try {
                    let labels = data.weekly.labels || ['初始'];
                    let values = data.weekly.data || [1.0];
                    if (values.length < 2) {
                        if (values.length === 1) {
                            values.push(values[0]);
                            labels.push('当前');
                        } else {
                            values = [1.0, 1.0];
                            labels = ['初始', '当前'];
                        }
                    }
                    new Chart(weeklyCtx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: '净值倍数',
                                data: values,
                                borderColor: '#4ecdc4',
                                backgroundColor: '#4ecdc422',
                                fill: true,
                                tension: 0.2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                y: {
                                    ticks: { color: '#8a9aa8' },
                                    grid: { color: '#2a3a4a' },
                                    min: 0.5,
                                },
                                x: { ticks: { color: '#8a9aa8', maxTicksLimit: 20 } }
                            }
                        }
                    });
                } catch (e) { console.warn('周净值图表绘制失败:', e); }
            }
        }

        async function saveTrade(id) {

async function importTradesFile(username) {
    const fileInput = document.getElementById('importFileInput');
    if (!fileInput.files || fileInput.files.length === 0) { alert('请选择文件'); return; }
    const file = fileInput.files[0];
    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            // 读取时保留原始格式，不自动转换日期
            const workbook = XLSX.read(data, { type: 'array', cellDates: false });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            // 转为对象数组，保留所有值作为字符串
            const rows = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
            if (rows.length === 0) { alert('文件为空'); return; }

            // 清洗列名（去除首尾空格、换行、制表符，统一转小写）
            const rawKeys = Object.keys(rows[0]);
            const cleanedKeys = rawKeys.map(k => k.trim().replace(/[\n\r\t]+/g, ' ').replace(/\s+/g, ' ').trim());
            
            // 建立映射：标准名 → 实际列名
            const aliasMap = {
                '日期': ['日期', 'date', '交易日期', '日', 'date', 'day'],
                '品种': ['品种', '交易品种', 'symbol', '商品', '标的', 'symbols'],
                '方向': ['方向', '交易方向', 'direction', '买卖', '类型', 'side'],
                '止损': ['止损', '止损位', 'stoploss', 'stop_loss', 'stop', 'sl'],
                '开仓价': ['开仓价', '开仓', 'openprice', 'open_price', 'open', 'op'],
                '手数': ['手数', '开仓手数', 'volume', '数量', 'lot', 'lots'],
                '平仓价': ['平仓价', '平仓', 'closeprice', 'close_price', 'close', 'cp']
            };

            const colMap = {};
            for (const [standard, aliases] of Object.entries(aliasMap)) {
                const lowerAliases = aliases.map(a => a.toLowerCase());
                for (let i = 0; i < cleanedKeys.length; i++) {
                    const key = cleanedKeys[i];
                    if (lowerAliases.includes(key)) {
                        colMap[standard] = rawKeys[i]; // 保留原始列名用于取值
                        break;
                    }
                }
            }

            // 检查必填列
            const required = ['日期', '品种', '方向', '止损', '开仓价', '手数'];
            const missing = required.filter(r => !colMap[r]);
            if (missing.length > 0) {
                const detected = cleanedKeys.join('、') || '（无）';
                alert(`缺少必要列：${missing.join('、')}。\n检测到的列名：${detected}\n请将列名改为标准名称。`);
                return;
            }

            const trades = [];
            rows.forEach(row => {
                const dateRaw = row[colMap['日期']];
                if (dateRaw === undefined || dateRaw === '') return;

                // 清洗字符串
                const clean = (val) => (val !== undefined && val !== null) ? String(val).trim() : '';
                const symbol = clean(row[colMap['品种']]);
                const direction = clean(row[colMap['方向']]);
                const stopLossRaw = clean(row[colMap['止损']]);
                const openPriceRaw = clean(row[colMap['开仓价']]);
                const volumeRaw = clean(row[colMap['手数']]);
                const closePriceRaw = colMap['平仓价'] ? clean(row[colMap['平仓价']]) : '';

                // 将字符串转数字（移除逗号等）
                const toNumber = (str) => {
                    if (str === '') return NaN;
                    const cleaned = str.replace(/,/g, '').trim();
                    return parseFloat(cleaned);
                };

                const stop_loss = toNumber(stopLossRaw);
                const open_price = toNumber(openPriceRaw);
                const volume = toNumber(volumeRaw);
                let close_price = (closePriceRaw !== '') ? toNumber(closePriceRaw) : null;

                if (!symbol || !direction || isNaN(stop_loss) || isNaN(open_price) || isNaN(volume) || volume <= 0) {
                    console.warn('跳过无效行（数值错误）：', row);
                    return;
                }
                if (close_price !== null && isNaN(close_price)) close_price = null;

                // 日期处理（支持多种格式）
                let dateStr = '';
                const dateStrRaw = String(dateRaw).trim();
                // 尝试匹配 YYYY-MM-DD 或 YYYY/MM/DD
                const match = dateStrRaw.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
                if (match) {
                    let y = match[1], m = match[2].padStart(2, '0'), d = match[3].padStart(2, '0');
                    dateStr = `${y}-${m}-${d}`;
                } else {
                    // 其他格式尝试用 Date 解析（本地时间）
                    const parsed = new Date(dateStrRaw);
                    if (!isNaN(parsed)) {
                        const y = parsed.getFullYear();
                        const m = String(parsed.getMonth() + 1).padStart(2, '0');
                        const d = String(parsed.getDate()).padStart(2, '0');
                        dateStr = `${y}-${m}-${d}`;
                    }
                }
                if (!dateStr) {
                    console.warn('日期解析失败：', dateRaw);
                    return;
                }

                trades.push({
                    username,
                    date: dateStr,
                    symbol,
                    direction,
                    stop_loss,
                    open_price,
                    volume,
                    close_price
                });
            });

            if (trades.length === 0) {
                alert('没有有效数据可导入。\n可能原因：\n1. 列名不匹配（检测到的列名已在上一步提示）\n2. 数值列含有非数字字符\n3. 日期格式无法识别\n请检查数据。');
                return;
            }

            const result = await apiRequest('/trades/batch', { method: 'POST', body: JSON.stringify(trades) });
            alert(`成功导入 ${result.inserted} 条记录`);
            closeModal();
            renderPage(currentPage);
        } catch (err) {
            alert('导入失败：' + err.message);
            console.error(err);
        }
    };
    reader.readAsArrayBuffer(file);
}

        async function importSymbolsFile() {
            const fileInput = document.getElementById('importSymbolFile');
            if (!fileInput.files || fileInput.files.length === 0) { alert('请选择文件'); return; }
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet);
                    if (rows.length === 0) { alert('文件为空'); return; }
                    const items = [];
                    rows.forEach(row => {
                        const symbol = row['交易品种'] || row['symbol'] || '';
                        const point_value = parseFloat(row['点值'] || row['pointValue'] || 0);
                        const tick_size = parseFloat(row['最小跳动点数'] || row['tickSize'] || 0);
                        const open_fee_rate = parseFloat(row['开仓手续费率'] || row['openFeeRate'] || 0);
                        const close_fee_rate = parseFloat(row['平仓手续费率'] || row['closeFeeRate'] || 0);
                        if (symbol && !isNaN(point_value) && !isNaN(tick_size) && !isNaN(open_fee_rate) && !isNaN(close_fee_rate)) {
                            items.push({ symbol, point_value, tick_size, open_fee_rate, close_fee_rate });
                        } else {
                            console.warn('跳过无效行:', row);
                        }
                    });
                    if (items.length === 0) { 
                        alert('没有有效数据，请检查表头是否匹配：交易品种,点值,最小跳动点数,开仓手续费率,平仓手续费率');
                        return;
                    }
                    const result = await apiRequest('/symbols/batch', { method: 'POST', body: JSON.stringify(items) });
                    let msg = `成功导入 ${result.inserted} 个品种`;
                    if (result.errors && result.errors.length > 0) {
                        msg += `\n以下品种导入失败：\n${result.errors.join('\n')}`;
                    }
                    alert(msg);
                    closeModal();
                    _symbolList = await apiRequest('/symbols');
                    renderPage(currentPage);
                } catch (err) {
                    alert('导入失败：' + err.message);
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        }
