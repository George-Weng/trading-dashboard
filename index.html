<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易数据分析看板 - 云端版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* 样式省略，请使用之前的完整样式，或从原文件中复制 */
        /* 这里假设您已有样式，为了缩短篇幅，不再重复 */
    </style>
</head>
<body>
    <!-- 登录页 -->
    <div id="loginPage">
        <div class="login-box">
            <h1>📊 <span>交易看板</span></h1>
            <div class="sub">云端版 · 数据持久化</div>
            <label>用户名</label>
            <input id="loginUser" type="text" placeholder="请输入用户名">
            <label>密码</label>
            <input id="loginPass" type="password" placeholder="请输入密码">
            <button class="btn-login" onclick="doLogin()">登 录</button>
            <div class="error" id="loginError"></div>
        </div>
    </div>

    <!-- 主应用 -->
    <div id="app">
        <header class="header">...</header>
        <div class="main-body">
            <nav class="sidebar">...</nav>
            <div class="content" id="contentArea"></div>
        </div>
    </div>

    <!-- 模态框 -->
    <div class="modal-overlay" id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>

    <script>
        // ======================================================================
        //  API 客户端
        // ======================================================================
        const API_BASE = '/api';
        async function apiRequest(endpoint, options = {}) {
            const token = localStorage.getItem('token');
            const headers = {
                'Content-Type': 'application/json',
                ...(token && { 'Authorization': `Bearer ${token}` }),
                ...options.headers
            };
            const response = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                throw new Error(err.error || '请求失败');
            }
            return response.json();
        }

        // ======================================================================
        //  工具函数（保留）
        // ======================================================================
        function formatCurrency(n) {
            if (n === undefined || n === null || isNaN(n)) return '—';
            let parts = n.toFixed(2).split('.');
            let intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return intPart + '.' + parts[1];
        }

        // ======================================================================
        //  会话状态
        // ======================================================================
        let currentUser = null;
        let viewingUser = 'all';
        let currentPage = 'home';
        let _editingUsername = null;

        // ======================================================================
        //  登录 / 登出
        // ======================================================================
        async function doLogin() {
            const errEl = document.getElementById('loginError');
            try {
                const username = document.getElementById('loginUser').value.trim();
                const password = document.getElementById('loginPass').value.trim();
                if (!username || !password) { errEl.textContent = '请输入用户名和密码'; return; }
                const data = await apiRequest('/auth', { method: 'POST', body: JSON.stringify({ username, password }) });
                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                localStorage.setItem('role', data.role);
                currentUser = { username: data.username, role: data.role };
                viewingUser = (data.role === 'admin') ? 'all' : data.username;
                errEl.textContent = '';
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                initApp();
            } catch (e) {
                errEl.textContent = e.message || '登录失败';
            }
        }

        function doLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            localStorage.removeItem('role');
            currentUser = null;
            viewingUser = 'all';
            document.getElementById('app').style.display = 'none';
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginError').textContent = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const loginPage = document.getElementById('loginPage');
                if (loginPage.style.display !== 'none') { e.preventDefault(); doLogin(); }
            }
        });

        // ======================================================================
        //  应用初始化
        // ======================================================================
        async function initApp() {
            if (!currentUser) { doLogout(); return; }
            document.getElementById('headerName').textContent = currentUser.username;
            document.getElementById('headerRole').textContent = currentUser.role === 'admin' ? '管理员' : '交易员';
            const container = document.getElementById('userSwitchContainer');
            if (currentUser.role === 'admin') {
                container.style.display = 'inline-block';
                await populateUserSwitch();
            } else {
                container.style.display = 'none';
            }
            const isAdmin = currentUser.role === 'admin';
            document.querySelectorAll('.sidebar .menu-item').forEach(item => {
                const page = item.dataset.page;
                if (page === 'home' || page === 'trades') { item.style.display = 'flex'; }
                else if (page === 'data' || page === 'users') { item.style.display = isAdmin ? 'flex' : 'none'; }
            });
            switchPage('home');
        }

        async function populateUserSwitch() {
            try {
                const users = await apiRequest('/users');
                const sel = document.getElementById('userSwitchSelect');
                sel.innerHTML = '';
                const allOpt = document.createElement('option');
                allOpt.value = 'all';
                allOpt.textContent = '📊 全部交易员';
                if (viewingUser === 'all') allOpt.selected = true;
                sel.appendChild(allOpt);
                users.forEach(u => {
                    if (u.role === 'trader') {
                        const opt = document.createElement('option');
                        opt.value = u.username;
                        opt.textContent = u.username;
                        if (u.username === viewingUser) opt.selected = true;
                        sel.appendChild(opt);
                    }
                });
            } catch (e) { console.warn('获取用户列表失败', e); }
        }

        function switchViewUser(username) {
            if (!currentUser || currentUser.role !== 'admin') return;
            viewingUser = username;
            renderPage(currentPage);
        }

        // ======================================================================
        //  页面路由
        // ======================================================================
        function switchPage(page) {
            currentPage = page;
            document.querySelectorAll('.sidebar .menu-item').forEach(el => {
                el.classList.toggle('active', el.dataset.page === page);
            });
            renderPage(page);
        }

        function renderPage(page) {
            const area = document.getElementById('contentArea');
            if (!area) return;
            area.innerHTML = '<div class="loading">加载中...</div>';
            try {
                switch (page) {
                    case 'home': renderHome(area); break;
                    case 'trades': renderTrades(area); break;
                    case 'data': renderData(area); break;
                    case 'users': renderUsers(area); break;
                    default: area.innerHTML = '<div class="empty-msg">页面不存在</div>';
                }
            } catch (e) {
                area.innerHTML = `<div class="empty-msg">渲染错误：${e.message}</div>`;
                console.error(e);
            }
        }

        // ======================================================================
        //  主页 (略，参考之前版本)
        // ======================================================================
        async function renderHome(area) { /* 同前，省略 */ }

        // ======================================================================
        //  交易记录 (含批量导入和清空)
        // ======================================================================
        async function renderTrades(area) {
            try {
                let url = '/trades';
                if (viewingUser !== 'all') url += `?user=${viewingUser}`;
                const trades = await apiRequest(url);
                const isAdmin = currentUser.role === 'admin';
                const label = viewingUser === 'all' ? '全部交易员' : viewingUser;
                let html = `<div class="page-title">📈 交易记录 <small>${label}</small></div>`;
                html += `<div class="toolbar">
                            <button class="btn btn-primary" onclick="openAddTrade()">＋ 添加记录</button>
                            <button class="btn btn-success" onclick="openImportTrades()">📥 批量导入</button>
                            <button class="btn btn-success" onclick="exportExcel()">📤 导出 Excel</button>
                            ${isAdmin ? (viewingUser === 'all' ? 
                                `<button class="btn btn-danger" onclick="clearAllTrades()">🗑️ 清空所有交易</button>` :
                                `<button class="btn btn-danger" onclick="clearUserTrades('${viewingUser}')">🗑️ 清空该用户交易</button>`) : ''}
                            <span style="color:var(--text-secondary);font-size:13px;margin-left:auto;">共 ${trades.length} 条</span>
                        </div>`;
                if (trades.length === 0) {
                    html += `<div class="empty-msg">暂无交易记录</div>`;
                } else {
                    const sorted = trades.sort((a,b) => (a.date < b.date ? 1 : -1));
                    html += `<div class="scroll-wrap"><table><thead><tr>`;
                    if (viewingUser === 'all') html += `<th>交易员</th>`;
                    html += `<th>日期</th><th>品种</th><th>方向</th><th>止损</th><th>开仓价</th><th>手数</th><th>平仓价</th><th>盈亏</th><th>操作</th></tr></thead><tbody>`;
                    sorted.forEach(t => {
                        html += `<tr>`;
                        if (viewingUser === 'all') html += `<td>${t.username}</td>`;
                        html += `<td>${t.date}</td><td>${t.symbol}</td><td>${t.direction}</td>
                                <td>${t.stop_loss}</td><td>${t.open_price}</td><td>${t.volume}</td>
                                <td>${t.close_price || '—'}</td>
                                <td style="color:${t.profit>=0?'var(--green-profit)':'var(--red-loss)'};">${t.profit>=0?'+':''}${formatCurrency(t.profit)}</td>
                                <td>
                                    <button class="btn" style="padding:2px 10px;font-size:12px;color:var(--gold);" onclick="editTrade(${t.id})">✎</button>
                                    <button class="btn" style="padding:2px 10px;font-size:12px;color:var(--red-loss);" onclick="deleteTrade(${t.id})">✕</button>
                                </td>`;
                        html += `</tr>`;
                    });
                    html += `</tbody></table></div>`;
                }
                area.innerHTML = html;
            } catch (e) {
                area.innerHTML = `<div class="empty-msg">加载交易记录失败：${e.message}</div>`;
            }
        }

        // ---- 新增交易（单条） ----
        function openAddTrade() {
            if (currentUser.role === 'admin' && viewingUser === 'all') {
                openSelectTraderModal(username => { if (username) openTradeModal(null, username); });
                return;
            }
            const username = (currentUser.role === 'admin') ? viewingUser : currentUser.username;
            if (!username) { alert('无法确定归属用户'); return; }
            openTradeModal(null, username);
        }

        function openTradeModal(tradeId, username) {
            _editingUsername = username;
            const modal = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            const title = tradeId ? '编辑交易记录' : '添加交易记录';
            const userDisplay = username ? `（${username}）` : '';
            box.innerHTML = `
                <h3>${title} ${userDisplay}</h3>
                <label>日期 *</label><input id="mTradeDate" type="date" value="${new Date().toISOString().slice(0,10)}">
                <label>交易品种 *</label><input id="mTradeSymbol" value="XAUUSD">
                <label>交易方向 *</label>
                <select id="mTradeDirection"><option value="买入">买入</option><option value="卖出">卖出</option></select>
                <label>止损位 *</label><input id="mTradeStop" type="number" step="any" placeholder="1950">
                <label>开仓价 *</label><input id="mTradeOpen" type="number" step="any" placeholder="1960.5">
                <label>开仓手数 *</label><input id="mTradeVolume" type="number" step="any" placeholder="1.0">
                <label>平仓价（可选）</label><input id="mTradeClose" type="number" step="any" placeholder="留空表示未平仓">
                <div class="btn-row">
                    <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                    <button class="btn btn-confirm" onclick="saveTrade(${tradeId || 'null'})">保存</button>
                </div>
            `;
            modal.classList.add('open');
        }

        async function saveTrade(id) {
            const date = document.getElementById('mTradeDate').value;
            const symbol = document.getElementById('mTradeSymbol').value.trim();
            const direction = document.getElementById('mTradeDirection').value;
            const stop_loss = parseFloat(document.getElementById('mTradeStop').value);
            const open_price = parseFloat(document.getElementById('mTradeOpen').value);
            const volume = parseFloat(document.getElementById('mTradeVolume').value);
            const close_price_raw = document.getElementById('mTradeClose').value.trim();
            const close_price = close_price_raw === '' ? null : parseFloat(close_price_raw);
            if (!date || !symbol || isNaN(stop_loss) || isNaN(open_price) || isNaN(volume)) {
                alert('请完整填写必填项');
                return;
            }
            const tradeData = { date, symbol, direction, stop_loss, open_price, volume, close_price };
            if (_editingUsername) tradeData.username = _editingUsername;
            try {
                if (id) {
                    await apiRequest(`/trades/${id}`, { method: 'PUT', body: JSON.stringify(tradeData) });
                } else {
                    await apiRequest('/trades', { method: 'POST', body: JSON.stringify(tradeData) });
                }
                closeModal();
                renderPage(currentPage);
            } catch (e) {
                alert('保存失败：' + e.message);
            }
        }

        async function deleteTrade(id) {
            if (!confirm('确认删除？')) return;
            try {
                await apiRequest(`/trades/${id}`, { method: 'DELETE' });
                renderPage(currentPage);
            } catch (e) {
                alert('删除失败：' + e.message);
            }
        }

        // ---- 批量导入交易 ----
        function openImportTrades() {
            if (currentUser.role === 'admin' && viewingUser === 'all') {
                openSelectTraderModal(username => {
                    if (username) openImportModal(username);
                });
                return;
            }
            const username = (currentUser.role === 'admin') ? viewingUser : currentUser.username;
            if (!username) { alert('无法确定归属用户'); return; }
            openImportModal(username);
        }

        function openImportModal(username) {
            const modal = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            box.innerHTML = `
                <h3>📥 批量导入交易 (${username})</h3>
                <p style="color:var(--text-secondary);font-size:13px;">支持 Excel (.xlsx) 或 CSV，表头：日期,交易品种,交易方向,止损位,开仓价,开仓手数,平仓价（可选）</p>
                <label>选择文件</label><input type="file" id="importFileInput" accept=".xlsx,.xls,.csv">
                <div class="btn-row">
                    <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                    <button class="btn btn-confirm" onclick="importTradesFile('${username}')">导入</button>
                </div>
            `;
            modal.classList.add('open');
        }

        async function importTradesFile(username) {
            const fileInput = document.getElementById('importFileInput');
            if (!fileInput.files || fileInput.files.length === 0) { alert('请选择文件'); return; }
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                    if (rows.length === 0) { alert('文件为空'); return; }
                    const trades = [];
                    rows.forEach(row => {
                        const dateStr = row['日期'] || row['date'] || '';
                        if (!dateStr) return;
                        const symbol = row['交易品种'] || row['symbol'] || '';
                        const direction = row['交易方向'] || row['direction'] || '';
                        const stop_loss = parseFloat(row['止损位'] || row['stopLoss'] || 0);
                        const open_price = parseFloat(row['开仓价'] || row['openPrice'] || 0);
                        const volume = parseFloat(row['开仓手数'] || row['volume'] || 0);
                        let close_price_raw = row['平仓价'] || row['closePrice'];
                        let close_price = (close_price_raw !== undefined && close_price_raw !== '') ? parseFloat(close_price_raw) : null;
                        if (!symbol || !direction || isNaN(stop_loss) || isNaN(open_price) || isNaN(volume)) return;
                        if (close_price !== null && isNaN(close_price)) close_price = null;
                        trades.push({ username, date: dateStr, symbol, direction, stop_loss, open_price, volume, close_price });
                    });
                    if (trades.length === 0) { alert('没有有效数据可导入'); return; }
                    const result = await apiRequest('/trades/batch', { method: 'POST', body: JSON.stringify(trades) });
                    alert(`成功导入 ${result.inserted} 条记录`);
                    closeModal();
                    renderPage(currentPage);
                } catch (err) {
                    alert('导入失败：' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // ---- 清空交易 ----
        async function clearUserTrades(username) {
            if (!confirm(`确认清空用户「${username}」的所有交易记录？`)) return;
            try {
                await apiRequest(`/trades?user=${username}`, { method: 'DELETE' });
                renderPage(currentPage);
            } catch (e) {
                alert('清空失败：' + e.message);
            }
        }

        async function clearAllTrades() {
            if (!confirm('⚠️ 确认清空所有交易记录？此操作不可撤销！')) return;
            try {
                await apiRequest('/trades', { method: 'DELETE' });
                renderPage(currentPage);
            } catch (e) {
                alert('清空失败：' + e.message);
            }
        }

        // ---- 选择交易员 ----
        function openSelectTraderModal(callback) {
            apiRequest('/users').then(users => {
                const traders = users.filter(u => u.role === 'trader');
                if (traders.length === 0) { alert('没有交易员用户'); return; }
                const modal = document.getElementById('modalOverlay');
                const box = document.getElementById('modalBox');
                box.innerHTML = `
                    <h3>选择交易员</h3>
                    <select id="traderSelect" style="width:100%;padding:8px;margin-top:12px;">
                        ${traders.map(u => `<option value="${u.username}">${u.username}</option>`).join('')}
                    </select>
                    <div class="btn-row">
                        <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                        <button class="btn btn-confirm" onclick="confirmTraderSelection()">确认</button>
                    </div>
                `;
                modal.classList.add('open');
                window.confirmTraderSelection = function() {
                    const sel = document.getElementById('traderSelect');
                    const username = sel.value;
                    closeModal();
                    if (callback) callback(username);
                };
            }).catch(err => alert('获取用户列表失败：' + err.message));
        }

        // ---- 导出（占位） ----
        function exportExcel() { alert('导出功能暂未实现'); }

        // ======================================================================
        //  数据维护 (含批量导入品种)
        // ======================================================================
        async function renderData(area) {
            if (currentUser.role !== 'admin') {
                area.innerHTML = `<div class="page-title">⚙️ 数据维护</div><div class="empty-msg">权限不足</div>`;
                return;
            }
            try {
                const users = await apiRequest('/users');
                const symbols = await apiRequest('/symbols');
                let html = `<div class="page-title">⚙️ 数据维护</div>
                            <div style="margin-bottom:16px;background:var(--bg-card);padding:16px;border-radius:var(--radius);border:1px solid var(--border-color);">
                                <h4 style="color:var(--gold);margin-bottom:12px;">💰 交易员初始资金</h4>
                                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;">`;
                users.filter(u => u.role === 'trader').forEach(u => {
                    html += `<div style="display:flex;align-items:center;gap:8px;background:var(--bg-input);padding:8px 12px;border-radius:6px;">
                                <span style="font-weight:600;min-width:60px;">${u.username}</span>
                                <input type="number" step="any" value="${u.initial_capital}" id="cap_${u.username}" style="flex:1;padding:4px 8px;">
                                <button class="btn" style="padding:2px 12px;background:var(--gold);color:#0b0e14;" onclick="saveUserCapital('${u.username}')">保存</button>
                            </div>`;
                });
                html += `</div></div>
                            <div style="margin-top:12px;">
                                <div class="toolbar">
                                    <button class="btn btn-primary" onclick="openAddSymbol()">＋ 添加品种</button>
                                    <button class="btn btn-success" onclick="openImportSymbols()">📥 导入品种</button>
                                    <button class="btn btn-success" onclick="exportSymbols()">📤 导出品种</button>
                                    <span style="color:var(--text-secondary);font-size:13px;margin-left:auto;">共 ${symbols.length} 个品种</span>
                                </div>
                                ${symbols.length === 0 ? '<div class="empty-msg">暂无品种配置</div>' :
                                    `<div class="scroll-wrap"><table><thead><tr><th>品种</th><th>点值</th><th>最小跳动</th><th>开仓费率</th><th>平仓费率</th><th>操作</th></tr></thead><tbody>
                                    ${symbols.map(s => `<tr>
                                        <td><strong>${s.symbol}</strong></td>
                                        <td>${s.point_value}</td>
                                        <td>${s.tick_size}</td>
                                        <td>${s.open_fee_rate}</td>
                                        <td>${s.close_fee_rate}</td>
                                        <td>
                                            <button class="btn" style="padding:2px 10px;font-size:12px;color:var(--gold);" onclick="editSymbol('${s.symbol}')">✎</button>
                                            <button class="btn" style="padding:2px 10px;font-size:12px;color:var(--red-loss);" onclick="deleteSymbol('${s.symbol}')">✕</button>
                                        </td>
                                    </tr>`).join('')}</tbody></table></div>`
                                }
                            </div>`;
                area.innerHTML = html;
            } catch (e) {
                area.innerHTML = `<div class="empty-msg">加载数据失败：${e.message}</div>`;
            }
        }

        // ---- 批量导入品种 ----
        function openImportSymbols() {
            const modal = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            box.innerHTML = `
                <h3>📥 批量导入品种</h3>
                <p style="color:var(--text-secondary);font-size:13px;">支持 Excel (.xlsx) 或 CSV，表头：交易品种,点值,最小跳动点数,开仓手续费率,平仓手续费率</p>
                <label>选择文件</label><input type="file" id="importSymbolFile" accept=".xlsx,.xls,.csv">
                <div class="btn-row">
                    <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                    <button class="btn btn-confirm" onclick="importSymbolsFile()">导入</button>
                </div>
            `;
            modal.classList.add('open');
        }

        async function importSymbolsFile() {
            const fileInput = document.getElementById('importSymbolFile');
            if (!fileInput.files || fileInput.files.length === 0) { alert('请选择文件'); return; }
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet);
                    if (rows.length === 0) { alert('文件为空'); return; }
                    const items = [];
                    rows.forEach(row => {
                        const symbol = row['交易品种'] || row['symbol'] || '';
                        const point_value = parseFloat(row['点值'] || row['pointValue'] || 0);
                        const tick_size = parseFloat(row['最小跳动点数'] || row['tickSize'] || 0);
                        const open_fee_rate = parseFloat(row['开仓手续费率'] || row['openFeeRate'] || 0);
                        const close_fee_rate = parseFloat(row['平仓手续费率'] || row['closeFeeRate'] || 0);
                        if (symbol && !isNaN(point_value) && !isNaN(tick_size) && !isNaN(open_fee_rate) && !isNaN(close_fee_rate)) {
                            items.push({ symbol, point_value, tick_size, open_fee_rate, close_fee_rate });
                        }
                    });
                    if (items.length === 0) { alert('没有有效数据'); return; }
                    const result = await apiRequest('/symbols/batch', { method: 'POST', body: JSON.stringify(items) });
                    alert(`成功导入 ${result.inserted} 个品种`);
                    closeModal();
                    renderPage(currentPage);
                } catch (err) {
                    alert('导入失败：' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // ---- 其他功能（修改密码、用户管理等）沿用之前，此处略 ----
        // 为节省篇幅，下面的函数请保留您之前的实现：saveUserCapital, openAddSymbol, saveSymbol, deleteSymbol, exportSymbols,
        // renderUsers, openAddUser, saveNewUser, deleteUser, openEditUserPwd, saveEditUserPwd, openChangePwd, saveChangePwd 等。

        // ======================================================================
        //  模态框工具
        // ======================================================================
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ======================================================================
        //  启动
        // ======================================================================
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token');
            const username = localStorage.getItem('username');
            const role = localStorage.getItem('role');
            if (token && username && role) {
                currentUser = { username, role };
                viewingUser = (role === 'admin') ? 'all' : username;
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                initApp();
            } else {
                document.getElementById('loginPage').style.display = 'flex';
                document.getElementById('app').style.display = 'none';
            }
        });
    </script>
</body>
</html>
